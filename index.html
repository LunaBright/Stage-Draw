<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10263a">
  <meta name="description" content="现场导入学校与节目名单，公开抽签并导出节目顺序。">
  <title>现场抽签 · 节目顺序</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/jszip.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" focusable="false"><path d="M9 35h30M14 29l10-17 10 17M18 29h12" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="9" r="2.5" fill="currentColor"/></svg></span><strong>现场抽签</strong></div>
    <div class="top-actions">
      <span id="topStatus" class="top-status">当前页面暂无数据</span>
      <button id="importButton" class="button button-primary" type="button">导入文件夹</button>
      <button id="newGroupButton" class="button button-quiet" type="button">新建组别</button>
      <button id="presentationButton" class="button button-quiet" type="button">全屏展示</button>
    </div>
    <input id="folderInput" class="visually-hidden" type="file" accept=".xlsx" webkitdirectory directory multiple>
  </header>
  <main class="layout">
    <aside id="sidebar" class="sidebar" aria-label="组别导航">
      <div class="sidebar-head"><span class="eyebrow">资料目录</span><h2>选择抽签组别</h2><p>先导入一个根文件夹，再选择要抽签的小组。</p></div>
      <label class="field-label" for="categoryFilter">顶层类别</label>
      <select id="categoryFilter" class="field-control"><option value="all">全部类别</option></select>
      <label class="field-label" for="searchInput">查找组别</label>
      <input id="searchInput" class="field-control" type="search" placeholder="输入类别或组别名称">
      <div id="groupList" class="group-list" aria-live="polite"></div>
    </aside>
    <section class="workspace">
      <div id="emptyState" class="empty-state">
        <h1>导入名单，开始抽签</h1>
        <p>选择包含分类目录和 Excel 表格的根文件夹，或手动新建组别。</p>
        <div class="empty-actions"><button id="emptyImportButton" class="button button-primary button-large" type="button">选择根文件夹</button><button id="emptyNewGroupButton" class="button button-outline button-large" type="button">手动新建组别</button></div>
      </div>
      <div id="groupView" hidden>
        <div class="group-heading">
          <div><div id="groupPath" class="path-label"></div><h1 id="groupTitle"></h1><div class="group-meta"><span id="groupCounts"></span><span id="groupStatus" class="status-badge"></span></div></div>
          <div class="group-tools"><button id="editButton" class="button button-outline" type="button">编辑名单</button><button id="undoButton" class="button button-outline" type="button">撤销上一签</button><button id="resetButton" class="button button-outline danger-outline" type="button">整组重新抽</button><button id="exportButton" class="button button-primary" type="button">导出当前组</button></div>
        </div>
        <div class="mode-row" aria-label="抽签方式"><button class="mode-button" data-mode="one" type="button"><span>方式一</span><strong>代表学校，一次定序</strong></button><button class="mode-button" data-mode="two" type="button"><span>方式二</span><strong>学校与节目，逐签抽取</strong></button></div>
        <div class="stage-layout"><section id="stageContent" class="stage-panel" aria-live="polite"></section><aside id="drawSidePanel" class="draw-side-panel"></aside></div>
        <section class="results-panel"><div class="section-heading"><div><span class="eyebrow">当前组结果</span><h2>节目出场顺序</h2></div><span id="resultCount" class="count-pill"></span></div><div id="resultsContent" class="results-content"></div></section>
      </div>
    </section>
  </main>
  <footer class="footer">导入名单和抽签结果只保存在本次打开的页面中。关闭或刷新后，请重新导入。</footer>
  <dialog id="newGroupDialog" class="modal">
    <form id="newGroupForm" method="dialog">
      <div class="modal-head"><div><span class="eyebrow">手动添加</span><h2>新建抽签组别</h2></div><button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button></div>
      <label class="field-label" for="newPath">分类路径</label><input id="newPath" class="field-control" placeholder="例如：器乐 / 合奏">
      <label class="field-label" for="newName">组别名称</label><input id="newName" class="field-control" placeholder="例如：本科甲组" required>
      <p id="newGroupError" class="form-error" role="alert"></p>
      <div class="modal-actions"><button class="button button-outline" value="cancel" type="submit">取消</button><button class="button button-primary" value="create" type="submit">创建并编辑名单</button></div>
    </form>
  </dialog>
  <dialog id="editorDialog" class="modal modal-wide">
    <div class="modal-head"><div><span class="eyebrow">当前组数据</span><h2>编辑学校与节目</h2></div><button id="closeEditorButton" class="icon-button" type="button" aria-label="关闭">×</button></div>
    <div class="editor-content">
      <div class="editor-fields"><div><label class="field-label" for="editPath">分类路径</label><input id="editPath" class="field-control"></div><div><label class="field-label" for="editName">组别名称</label><input id="editName" class="field-control"></div></div>
      <div class="editor-columns"><section><div class="editor-section-head"><h3>学校名单</h3><button id="addSchoolButton" class="text-button" type="button">＋ 添加学校</button></div><div id="schoolEditorRows"></div></section><section><div class="editor-section-head"><h3>节目单</h3><button id="addProgramButton" class="text-button" type="button">＋ 添加节目</button></div><div id="programEditorRows"></div></section></div>
      <p id="editorError" class="form-error" role="alert"></p>
    </div>
    <div class="modal-actions"><button id="cancelEditorButton" class="button button-outline" type="button">取消</button><button id="saveEditorButton" class="button button-primary" type="button">保存修改</button></div>
  </dialog>
  <dialog id="importDialog" class="modal">
    <div class="modal-head"><div><span class="eyebrow">导入完成</span><h2 id="importTitle">文件夹已读取</h2></div><button id="closeImportButton" class="icon-button" type="button" aria-label="关闭">×</button></div>
    <p id="importSummary" class="modal-copy"></p><div id="importWarnings" class="import-warnings"></div>
    <div class="modal-actions"><button id="importDoneButton" class="button button-primary" type="button">开始选择组别</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
